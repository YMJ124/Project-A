# Formal all-target TreeSHAP and stable-community joint permutation. Each of
# the 21 frozen folds is an atomic checkpoint and raw SHAP is stored by fold.
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
  target_scope: main
base_run: "problem2/artifacts/q2_formal_all7_fast_v1"
network_nodes_paths:
  - "problem2/artifacts/q2_network_repeat0_full_v1/network_nodes_confirmation.csv"
  - "problem2/artifacts/q2_network_stability_confirmation_v1/network_nodes_confirmation.csv"
  - "problem2/artifacts/q2_network_repeat2_v1/network_nodes_confirmation.csv"
  - "problem2/artifacts/q2_network_repeat3_v1/network_nodes_confirmation.csv"
  - "problem2/artifacts/q2_network_repeat4_v1/network_nodes_confirmation.csv"
  - "problem2/artifacts/q2_network_repeat5_v1/network_nodes_confirmation.csv"
  - "problem2/artifacts/q2_network_repeat6_v1/network_nodes_confirmation.csv"
network_variant: stable_filtered
output_root: "problem2/artifacts/q2_formal_all7_advanced_fast_v1"
targets: all_main
repeats: [0, 1, 2, 3, 4, 5, 6]
outer_folds: [0, 1, 2]
group_permutations: 20
group_permutation_seed: 20442024
style_minimum_group_n: 3
style_report_minimum_n: 8
direction_reversal_min_abs_global_rho: 0.10
direction_reversal_min_abs_style_rho: 0.20
top_k: 10
reconstruction_tolerance: 1.0e-9
n_jobs: 1
