# Exact-speed comparison against q2_all30_smoke_v1: same repeat/fold/targets
# and one permutation in each mode, but using shared prediction + streaming.
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  chemical_network_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/2.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
  target_scope: main
frozen_q1:
  freeze_dir: "problem1/freezes/problem1_v1"
  source_registry: "problem1/freezes/problem1_v1/source_registry.csv"
  oof_predictions: "problem1/freezes/problem1_v1/champion_artifacts/oof_predictions.parquet"
  folds: "problem1/freezes/problem1_v1/base_run_metadata/folds.csv"
  tuning_trials: "problem1/freezes/problem1_v1/base_run_metadata/tuning_trials.csv"
experiment:
  run_name: q2_all30_fast_smoke_v1
  scope: all_main_fast_engineering_smoke_not_formal_top3
  targets: all_main
  repeats: [4]
  outer_folds: [0]
explanation:
  modes: [within_style, unconditional]
  primary_mode: within_style
  permutations_by_mode:
    within_style: 1
    unconditional: 1
  permutation_seed: 20435024
  style_minimum_group_n: 3
  reconstruction_tolerance: 1.0e-9
  top_k: [3, 10]
stability:
  top10_frequency_minimum: 0.60
  positive_importance_frequency_minimum: 0.80
  direction_consistency_minimum: 0.70
runtime:
  output_root: "problem2/artifacts/q2_all30_fast_smoke_v1"
  n_jobs: 1
