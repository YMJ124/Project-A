data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
interfaces:
  folds_csv: "problem1/freezes/problem1_v1/base_run_metadata/folds.csv"
  defect_registry_csv: "problem3/artifacts/preflight_v1/defect_constraint_registry.csv"
  consensus_edges_csv: "problem3/interfaces/q2_handoff_v1/consensus_edges.csv"
  derived_formula_yaml: "problem3/configs/derived_feature_formulas_v1.yaml"
styles:
  generation_targets: [Tripel, Kriek, Lambic]
baselines:
  knn_jitter:
    neighbors: 3
    jitter_min: 0.05
    jitter_max: 0.35
  pca_shrink_gaussian:
    n_components: 15
    prior_strength: 20.0
  rank_gaussian_copula:
    prior_strength: 5.0
evaluation:
  repeats: [3, 4, 5, 6]
  folds: [0, 1, 2]
  real_real_resamples: 100
  bootstrap_resamples: 2000
  bootstrap_seed: 20261029
runtime:
  run_name: "q3_baseline_confirmation_reference_v1"
  output_root: "problem3/artifacts/q3_baseline_confirmation_reference_v1"
  phase: "confirmation_reference"
