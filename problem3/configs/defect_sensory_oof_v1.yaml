data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
  target_scope: all
  target_names: [dms, diacetyl, X4vg, t2n, stale_hops]

validation:
  outer_splits: 3
  outer_repeats: 7
  inner_splits: 2
  base_seed: 20311124

runtime:
  output_root: "problem3/artifacts/interfaces"
  n_jobs: 1
  save_models: false

models:
  enabled:
    - global_mean
    - style_mean
    - extra_trees
    - extra_trees_targetwise
    - gradient_boosting
  grids:
    extra_trees:
      - {n_estimators: 250, max_features: 0.5, min_samples_leaf: 5}
    extra_trees_targetwise:
      - {n_estimators: 250, max_features: 0.5, min_samples_leaf: 5}
    gradient_boosting:
      - {n_estimators: 150, learning_rate: 0.03, max_depth: 1, min_samples_leaf: 8}
