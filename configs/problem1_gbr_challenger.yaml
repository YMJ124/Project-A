# Paired challenger experiment: keep the confirmed Extra Trees champion and
# add only target-wise Gradient Boosting, following the paper's strongest
# reported model family. The first three confirmation seeds/folds are reused.
# Interpret standalone ET/GBR metrics; do not promote nested family switching.
# AI-assisted configuration draft (OpenAI Codex, GPT-5, 2026-10-24).
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: "beer"
  style_column: "tasting_category_fine"
  forbidden_input_columns: ["beer", "beer_id", "tasting_category_fine"]
  target_scope: "main"

validation:
  outer_splits: 3
  outer_repeats: 3
  inner_splits: 2
  base_seed: 20271124

runtime:
  output_root: "artifacts/problem1"
  n_jobs: 1
  save_models: false

models:
  enabled:
    - global_mean
    - style_mean
    - extra_trees
    - gradient_boosting
  grids:
    extra_trees:
      - {n_estimators: 250, max_features: "sqrt", min_samples_leaf: 5}
      - {n_estimators: 250, max_features: 0.5, min_samples_leaf: 5}
      - {n_estimators: 400, max_features: "sqrt", min_samples_leaf: 2}
      - {n_estimators: 400, max_features: 0.5, min_samples_leaf: 2}
    gradient_boosting:
      - {n_estimators: 150, learning_rate: 0.03, max_depth: 1, min_samples_leaf: 8}
      - {n_estimators: 250, learning_rate: 0.03, max_depth: 2, min_samples_leaf: 8}
      - {n_estimators: 250, learning_rate: 0.05, max_depth: 2, min_samples_leaf: 5}
