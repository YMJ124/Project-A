# Single-mechanism screen: leakage-safe, cross-fitted affine recalibration of
# an otherwise identical Extra Trees model.  The calibration map is learned
# only inside each outer training fold and shrunk halfway toward identity.
# Discovery targets were fixed before this run from the 20281124 residual audit.
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: "beer"
  style_column: "tasting_category_fine"
  forbidden_input_columns: ["beer", "beer_id", "tasting_category_fine"]
  target_scope: "main"

validation:
  outer_splits: 3
  outer_repeats: 3
  inner_splits: 2
  base_seed: 20291124

runtime:
  output_root: "artifacts/problem1"
  n_jobs: 1
  save_models: false

models:
  enabled: [global_mean, style_mean, extra_trees, extra_trees_affine_calibrated]
  grids:
    extra_trees:
      - {n_estimators: 250, max_features: 0.5, min_samples_leaf: 5, random_state_override: 20291124}
    extra_trees_affine_calibrated:
      - {n_estimators: 250, max_features: 0.5, min_samples_leaf: 5, random_state_override: 20291124, calibration_splits: 3, identity_weight: 0.5, slope_min: 0.8, slope_max: 1.5, clip_to_training_range: true}
