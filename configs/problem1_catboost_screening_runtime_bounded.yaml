# Runtime-bounded form of the predeclared CatBoost mechanism.  The original
# 150-tree run was stopped before any aggregate score was produced because its
# projected runtime exceeded five minutes.  80 trees at lr=0.05 preserves a
# similar conservative boosting budget while fitting the agreed time limit.
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
  target_scope: main

validation: {outer_splits: 3, outer_repeats: 3, inner_splits: 2, base_seed: 20401124}
runtime: {output_root: artifacts/problem1, n_jobs: 1, save_models: false}

models:
  enabled: [global_mean, style_mean, catboost]
  grids:
    catboost:
      - {iterations: 80, learning_rate: 0.05, depth: 4, l2_leaf_reg: 10.0, random_strength: 1.0, loss_function: RMSE, thread_count: 1}
