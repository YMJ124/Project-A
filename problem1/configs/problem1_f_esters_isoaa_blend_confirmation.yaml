# Target-level half-blend confirmation on folds not inspected for this target.
# Fixed before evaluation: F_esters_isoaa, weight 0.5 tuned multi-output ET +
# 0.5 targetwise ET.  The matching multi-output control already exists in
# q1_fixed_scale_confirmation_control_v1 (base seed 20311124).
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
  target_scope: main
  target_names: [F_esters_isoaa]
validation: {outer_splits: 3, outer_repeats: 7, inner_splits: 2, base_seed: 20311124}
runtime: {output_root: artifacts/problem1, n_jobs: 1, save_models: false}
models:
  fixed_without_inner_cv: true
  enabled: [global_mean, style_mean, extra_trees_targetwise]
  grids:
    extra_trees_targetwise:
      - {n_estimators: 250, max_features: 0.5, min_samples_leaf: 5}
