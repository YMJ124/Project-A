# Fresh-seed confirmation for the discovery-nominated k=30 target:
# A_malt_cara. All other outputs are retained only for audit.
# Adoption: mean RMSE gain >=1%, wins >=5/7, median Spearman delta >=0,
# and no target-grade downgrade versus the tuned ET control.
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: "beer"
  style_column: "tasting_category_fine"
  forbidden_input_columns: ["beer", "beer_id", "tasting_category_fine"]
  target_scope: "main"
validation: {outer_splits: 3, outer_repeats: 7, inner_splits: 2, base_seed: 20281124}
runtime: {output_root: "artifacts/problem1", n_jobs: 1, save_models: false}
models:
  fixed_without_inner_cv: true
  enabled: [global_mean, style_mean, extra_trees_targetwise_selectk]
  grids:
    extra_trees_targetwise_selectk:
      - {k: 30, n_estimators: 250, max_features: 0.5, min_samples_leaf: 5}
