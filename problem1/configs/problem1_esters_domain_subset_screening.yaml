# Literature-predeclared ester chemistry and fermentation-precursor subset.
# The fixed indices include measured esters, higher alcohol/acid precursors,
# ethanol matrix context, esters_sum and acids_sum.
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
  target_scope: main
  target_names: [A_esters_all, A_esters_ethac, A_esters_isoaa, A_esters_flower, A_esters_fruity, F_esters_all, F_esters_ethac, F_esters_isoaa, F_esters_flower, F_esters_fruity]
validation: {outer_splits: 3, outer_repeats: 3, inner_splits: 2, base_seed: 20441124}
runtime: {output_root: artifacts/problem1, n_jobs: 1, save_models: false}
models:
  fixed_without_inner_cv: true
  enabled: [global_mean, style_mean, extra_trees_targetwise_subset]
  grids:
    extra_trees_targetwise_subset:
      - n_estimators: 250
        max_features: 0.5
        min_samples_leaf: 5
        feature_indices: [4, 5, 6, 7, 8, 9, 10, 12, 13, 14, 15, 17, 18, 19, 22, 33, 37, 41, 42, 43, 44, 45, 48, 49, 52, 54, 61, 62, 65, 74, 84, 85, 89, 90, 98, 112, 113, 115, 116, 125, 130, 131, 134, 135, 137, 142, 144, 156, 158, 160, 162, 164, 166, 167, 168, 169, 173, 184, 190, 205, 211, 212, 213, 214, 215, 216, 217, 219, 222, 224, 225, 227, 229]
