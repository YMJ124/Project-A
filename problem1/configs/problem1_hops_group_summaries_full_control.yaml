# Same fresh folds and targetwise ET, without the three added summaries.
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
  target_scope: main
  target_names: [A_hops_all, A_hops_citrus, A_hops_tropical, A_hops_noble, A_hops_woody, F_hops_all, F_hops_citrus, F_hops_tropical, F_hops_noble, F_hops_woody]
validation: {outer_splits: 3, outer_repeats: 3, inner_splits: 2, base_seed: 20451124}
runtime: {output_root: artifacts/problem1, n_jobs: 1, save_models: false}
models:
  fixed_without_inner_cv: true
  enabled: [global_mean, style_mean, extra_trees_targetwise]
  grids:
    extra_trees_targetwise:
      - {n_estimators: 250, max_features: 0.5, min_samples_leaf: 5}
