# Single-mechanism CatBoost screening.  Shallow trees and strong L2
# regularization are fixed before inspecting the new outer folds.
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
  target_scope: main

validation: {outer_splits: 3, outer_repeats: 3, inner_splits: 2, base_seed: 20401124}
runtime: {output_root: artifacts/problem1, n_jobs: 1, save_models: false}

models:
  enabled: [global_mean, style_mean, catboost]
  grids:
    catboost:
      - {iterations: 150, learning_rate: 0.03, depth: 4, l2_leaf_reg: 10.0, random_strength: 1.0, loss_function: RMSE, thread_count: 1}
