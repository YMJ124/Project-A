# Discovery-only test of one rank-aware specialist for A_malt_burn.  The
# target, 50/50 blend weight, seed, and acceptance criteria were fixed before
# looking at this run.  All target ranks and inverse quantiles are learned
# inside the current training fold.
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
  target_scope: main
validation: {outer_splits: 3, outer_repeats: 3, inner_splits: 2, base_seed: 20341124}
runtime: {output_root: artifacts/problem1, n_jobs: 1, save_models: false}
models:
  enabled: [global_mean, style_mean, extra_trees, extra_trees_rank_blended]
  grids:
    extra_trees:
      - {n_estimators: 250, max_features: 0.5, min_samples_leaf: 5, random_state_override: 20341124}
    extra_trees_rank_blended:
      - {target_index: 4, rank_weight: 0.5, n_estimators: 250, max_features: 0.5, min_samples_leaf: 5, random_state_override: 20341124}
