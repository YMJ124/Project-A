# Fold-local skew-log + robust-scaling screening for linear/PLS models.
# This is an isolated outlier/extrapolation mechanism test on three repeats.
# AI-assisted configuration draft (OpenAI Codex, GPT-5, 2026-10-24).
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: "beer"
  style_column: "tasting_category_fine"
  forbidden_input_columns: ["beer", "beer_id", "tasting_category_fine"]
  target_scope: "main"

validation:
  outer_splits: 3
  outer_repeats: 3
  inner_splits: 2
  base_seed: 20271124

runtime:
  output_root: "artifacts/problem1"
  n_jobs: 1
  save_models: false

models:
  enabled:
    - global_mean
    - style_mean
    - ridge_skew_robust
    - pls1_skew_robust
    - pls2_skew_robust
  grids:
    ridge_skew_robust:
      - {alpha: 1000.0}
      - {alpha: 100.0}
      - {alpha: 10.0}
      - {alpha: 1.0}
    pls1_skew_robust:
      - {n_components: 2}
      - {n_components: 5}
      - {n_components: 10}
    pls2_skew_robust:
      - {n_components: 2}
      - {n_components: 5}
      - {n_components: 10}
