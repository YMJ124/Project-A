# Same-fold tuned multi-output Extra Trees control for the A_esters_all GBR
# confirmation.  This keeps the current champion's core inner-CV protocol.
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
  target_scope: main
validation: {outer_splits: 3, outer_repeats: 7, inner_splits: 2, base_seed: 20351124}
runtime: {output_root: artifacts/problem1, n_jobs: 1, save_models: false}
models:
  enabled: [global_mean, style_mean, extra_trees]
  grids:
    extra_trees:
      - {n_estimators: 250, max_features: sqrt, min_samples_leaf: 5}
      - {n_estimators: 250, max_features: 0.5, min_samples_leaf: 5}
      - {n_estimators: 400, max_features: sqrt, min_samples_leaf: 2}
      - {n_estimators: 400, max_features: 0.5, min_samples_leaf: 2}
