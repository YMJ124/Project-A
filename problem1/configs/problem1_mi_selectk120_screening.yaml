# Non-linear mutual-information feature screening fitted independently inside
# every target and training fold.  k=120 is fixed from the earlier successful
# capacity regime; no external importance or full-data target information.
data:
  chemicals_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/1.csv"
  sensory_csv: "2026年MathorCup大数据挑战赛-赛道A初赛/附件/4.csv"
  id_column: beer
  style_column: tasting_category_fine
  forbidden_input_columns: [beer, beer_id, tasting_category_fine]
  target_scope: main

validation: {outer_splits: 3, outer_repeats: 3, inner_splits: 2, base_seed: 20411124}
runtime: {output_root: artifacts/problem1, n_jobs: 1, save_models: false}

models:
  enabled: [global_mean, style_mean, extra_trees_targetwise_selectk_mi]
  grids:
    extra_trees_targetwise_selectk_mi:
      - {k: 120, n_estimators: 250, max_features: 0.5, min_samples_leaf: 5}
